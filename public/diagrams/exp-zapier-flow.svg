<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-labelledby="t d"><title id="t">The automation I rely on</title><desc id="d">The automation I rely on</desc><rect x="1" y="1" width="798" height="298" fill="#f2eedd" stroke="#1b1f23" stroke-opacity="0.25"/><text x="400" y="36" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#1b1f23">The automation I rely on</text><rect x="40" y="62" width="226" height="196" rx="4" fill="#fbf9f1" stroke="#1b1f23" stroke-width="1.5"/><text x="54" y="88" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#8a5a00">STEP 1</text><text x="153.0" y="118" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1b1f23">A new inquiry arrives</text><text x="153.0" y="140" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1b1f23">through my contact form</text><text x="268" y="168" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1b1f23">→</text><rect x="286" y="62" width="226" height="196" rx="4" fill="#fbf9f1" stroke="#1b1f23" stroke-width="1.5"/><text x="300" y="88" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#8a5a00">STEP 2</text><text x="399.0" y="118" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1b1f23">Zapier picks it up</text><text x="399.0" y="140" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1b1f23">automatically</text><text x="514" y="168" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1b1f23">→</text><rect x="532" y="62" width="226" height="196" rx="4" fill="#fbf9f1" stroke="#1b1f23" stroke-width="1.5"/><text x="546" y="88" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#8a5a00">STEP 3</text><text x="645.0" y="118" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1b1f23">It lands in my Notion</text><text x="645.0" y="140" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1b1f23">project database —</text><text x="645.0" y="162" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1b1f23">and I get a notification</text></svg>