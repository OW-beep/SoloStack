<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" role="img" aria-labelledby="t d"><title id="t">Structure of the Notion setup</title><desc id="d">A master list covers every project. Each client has a page with the project name, deadline, deliverables, items waiting on the client and links. What the client sees is kept apart from my own notes.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b1f23"/></marker></defs><rect x="1" y="1" width="798" height="378" fill="#f2eedd" stroke="#1b1f23" stroke-opacity="0.25"/><text x="400" y="36" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#1b1f23">One list, one page per client, one rule</text><rect x="20" y="90" width="200" height="200" rx="4" fill="#fbf9f1" stroke="#1b1f23" stroke-width="1.5"/><text x="120" y="120" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#1b1f23">Master list</text><text x="120" y="152" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1f23">Every project,</text><text x="120" y="172" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1f23">one row each</text><text x="120" y="192" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1f23"></text><text x="120" y="212" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1f23">Deadline</text><text x="120" y="232" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1f23">Progress</text><line x1="222" y1="190" x2="268" y2="190" stroke="#1b1f23" stroke-width="2" marker-end="url(#a)"/><rect x="272" y="90" width="230" height="200" rx="4" fill="#fbf9f1" stroke="#1b1f23" stroke-width="1.5"/><text x="387" y="120" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#1b1f23">Client page</text><text x="387" y="152" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1f23">Project name</text><text x="387" y="173" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1f23">Deadline</text><text x="387" y="194" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1f23">Deliverables</text><text x="387" y="215" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1f23">Waiting on the client</text><text x="387" y="236" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1f23">Related links</text><line x1="504" y1="150" x2="548" y2="128" stroke="#1b1f23" stroke-width="2" marker-end="url(#a)"/><line x1="504" y1="230" x2="548" y2="252" stroke="#1b1f23" stroke-width="2" marker-end="url(#a)"/><rect x="552" y="78" width="230" height="96" rx="4" fill="#dcebe6" stroke="#3e7c8a" stroke-width="1.5"/><text x="667" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1b1f23">Shared with the client</text><text x="667" y="134" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1b1f23">What the client needs to see</text><rect x="552" y="208" width="230" height="96" rx="4" fill="#f8e6c8" stroke="#e8a33d" stroke-width="1.5"/><text x="667" y="238" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1b1f23">My own notes</text><text x="667" y="264" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1b1f23">Kept apart so nothing about</text><text x="667" y="282" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1b1f23">another client is shared</text><text x="400" y="342" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#555">Start with the single table; add client pages once several projects overlap.</text></svg>