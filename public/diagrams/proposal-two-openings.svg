<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" aria-labelledby="t d"><title id="t">Two ways to open a proposal</title><desc id="d">A proposal that opens with the writer’s past work and services got a weak response. The same proposal rewritten as one page that opens with the client’s problem got a reply and a negotiation.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b1f23"/></marker></defs><rect x="1" y="1" width="798" height="338" fill="#f2eedd" stroke="#1b1f23" stroke-opacity="0.25"/><text x="400" y="36" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#1b1f23">Two ways to open the same proposal</text><rect x="30" y="70" width="350" height="200" rx="4" fill="#fbf9f1" stroke="#1b1f23" stroke-width="1.5"/><text x="205" y="100" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#1b1f23">Opens with me</text><text x="205" y="134" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1f23">Track record and</text><text x="205" y="154" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1f23">services, in detail</text><line x1="205" y1="170" x2="205" y2="200" stroke="#1b1f23" stroke-width="2" marker-end="url(#a)"/><rect x="80" y="202" width="250" height="52" rx="4" fill="#f3d9d4" stroke="#c94a3f" stroke-width="1.5"/><text x="205" y="234" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#1b1f23">Weak response</text><rect x="420" y="70" width="350" height="200" rx="4" fill="#fbf9f1" stroke="#1b1f23" stroke-width="1.5"/><text x="595" y="100" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#1b1f23">Opens with their problem</text><text x="595" y="134" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1f23">Problem, plan, timeline</text><text x="595" y="154" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1f23">and price on one page</text><line x1="595" y1="170" x2="595" y2="200" stroke="#1b1f23" stroke-width="2" marker-end="url(#a)"/><rect x="470" y="202" width="250" height="52" rx="4" fill="#dcebe6" stroke="#3e7c8a" stroke-width="1.5"/><text x="595" y="234" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1b1f23">A reply, then a negotiation</text><text x="400" y="308" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#555">From my own proposals. One freelancer’s experience, not a guarantee.</text></svg>