<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-labelledby="t d"><title id="t">How I smooth out irregular income</title><desc id="d">How I smooth out irregular income</desc><rect x="1" y="1" width="798" height="298" fill="#f2eedd" stroke="#1b1f23" stroke-opacity="0.25"/><text x="400" y="36" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#1b1f23">How I smooth out irregular income</text><rect x="40" y="62" width="226" height="196" rx="4" fill="#fbf9f1" stroke="#1b1f23" stroke-width="1.5"/><text x="54" y="88" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#8a5a00">IN A GOOD MONTH</text><text x="153.0" y="118" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1b1f23">Set aside tax and social</text><text x="153.0" y="140" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1b1f23">insurance first —</text><text x="153.0" y="162" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1b1f23">before spending anything</text><text x="268" y="168" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1b1f23">→</text><rect x="286" y="62" width="226" height="196" rx="4" fill="#fbf9f1" stroke="#1b1f23" stroke-width="1.5"/><text x="300" y="88" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#8a5a00">THE BUFFER</text><text x="399.0" y="118" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1b1f23">Keep about 6 months of</text><text x="399.0" y="140" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1b1f23">living costs in savings</text><text x="399.0" y="162" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1b1f23">I can reach anytime</text><text x="514" y="168" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1b1f23">→</text><rect x="532" y="62" width="226" height="196" rx="4" fill="#fbf9f1" stroke="#1b1f23" stroke-width="1.5"/><text x="546" y="88" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#8a5a00">EVERY FEW MONTHS</text><text x="645.0" y="118" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1b1f23">Review fixed costs:</text><text x="645.0" y="140" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1b1f23">cancel unused tools,</text><text x="645.0" y="162" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1b1f23">check for duplicates</text></svg>