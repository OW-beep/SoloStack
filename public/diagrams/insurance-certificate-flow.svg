<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 310" width="800" height="310" role="img" aria-labelledby="t d"><title id="t">From the request to the certificate</title><desc id="d">When a client asks for proof of insurance: read what they need, request a certificate of insurance from your insurer, and send it with the contract documents.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b1f23"/></marker></defs><rect x="1" y="1" width="798" height="308" fill="#f2eedd" stroke="#1b1f23" stroke-opacity="0.25"/><text x="400" y="36" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#1b1f23">Proof of insurance, step by step</text><rect x="20" y="80" width="160" height="150" rx="4" fill="#fbf9f1" stroke="#1b1f23" stroke-width="1.5"/><circle cx="46" cy="108" r="14" fill="#e8a33d" stroke="#1b1f23" stroke-width="1.5"/><text x="46" y="113" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1b1f23">1</text><text x="68" y="114" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#1b1f23">Client asks</text><line x1="32" y1="132" x2="168" y2="132" stroke="#1b1f23" stroke-opacity="0.2"/><text x="32" y="158" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#1b1f23">for proof of</text><text x="32" y="178" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#1b1f23">insurance</text><rect x="220" y="80" width="160" height="150" rx="4" fill="#fbf9f1" stroke="#1b1f23" stroke-width="1.5"/><circle cx="246" cy="108" r="14" fill="#e8a33d" stroke="#1b1f23" stroke-width="1.5"/><text x="246" y="113" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1b1f23">2</text><text x="268" y="114" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#1b1f23">Their needs</text><line x1="232" y1="132" x2="368" y2="132" stroke="#1b1f23" stroke-opacity="0.2"/><text x="232" y="158" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#1b1f23">Coverage type,</text><text x="232" y="178" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#1b1f23">limits, who must</text><text x="232" y="198" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#1b1f23">be named</text><rect x="420" y="80" width="160" height="150" rx="4" fill="#fbf9f1" stroke="#1b1f23" stroke-width="1.5"/><circle cx="446" cy="108" r="14" fill="#e8a33d" stroke="#1b1f23" stroke-width="1.5"/><text x="446" y="113" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1b1f23">3</text><text x="468" y="114" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#1b1f23">Request it</text><line x1="432" y1="132" x2="568" y2="132" stroke="#1b1f23" stroke-opacity="0.2"/><text x="432" y="158" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#1b1f23">A certificate of</text><text x="432" y="178" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#1b1f23">insurance, from</text><text x="432" y="198" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#1b1f23">your insurer</text><rect x="620" y="80" width="160" height="150" rx="4" fill="#fbf9f1" stroke="#1b1f23" stroke-width="1.5"/><circle cx="646" cy="108" r="14" fill="#e8a33d" stroke="#1b1f23" stroke-width="1.5"/><text x="646" y="113" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1b1f23">4</text><text x="668" y="114" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#1b1f23">Send it</text><line x1="632" y1="132" x2="768" y2="132" stroke="#1b1f23" stroke-opacity="0.2"/><text x="632" y="158" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#1b1f23">With the contract</text><text x="632" y="178" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#1b1f23">documents; keep</text><text x="632" y="198" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#1b1f23">a copy</text><line x1="182" y1="155" x2="218" y2="155" stroke="#1b1f23" stroke-width="2" marker-end="url(#a)"/><line x1="382" y1="155" x2="418" y2="155" stroke="#1b1f23" stroke-width="2" marker-end="url(#a)"/><line x1="582" y1="155" x2="618" y2="155" stroke="#1b1f23" stroke-width="2" marker-end="url(#a)"/><text x="400" y="272" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1b1f23">Learn your insurer’s request process before a client asks.</text></svg>