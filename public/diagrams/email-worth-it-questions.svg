<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" role="img" aria-labelledby="t d"><title id="t">Three questions to decide on a custom domain email</title><desc id="d">Three yes or no questions: does client and invoice mail pile up in your personal inbox, would you rather not write to new contacts from a free address, and can you spare an hour or two plus a small monthly fee. Two or more yes answers mean it is worth setting up.</desc><rect x="1" y="1" width="798" height="328" fill="#f2eedd" stroke="#1b1f23" stroke-opacity="0.25"/><text x="400" y="36" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#1b1f23">Three questions I would ask before paying for it</text><rect x="25" y="66" width="230" height="150" rx="4" fill="#fbf9f1" stroke="#1b1f23" stroke-width="1.5"/><circle cx="53" cy="94" r="14" fill="#e8a33d" stroke="#1b1f23" stroke-width="1.5"/><text x="53" y="99" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1b1f23">1</text><text x="77" y="100" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#1b1f23">Yes or no?</text><line x1="39" y1="118" x2="241" y2="118" stroke="#1b1f23" stroke-opacity="0.2"/><text x="41" y="146" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#1b1f23">Does client and invoice</text><text x="41" y="168" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#1b1f23">mail pile up in your</text><text x="41" y="190" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#1b1f23">personal inbox?</text><rect x="285" y="66" width="230" height="150" rx="4" fill="#fbf9f1" stroke="#1b1f23" stroke-width="1.5"/><circle cx="313" cy="94" r="14" fill="#e8a33d" stroke="#1b1f23" stroke-width="1.5"/><text x="313" y="99" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1b1f23">2</text><text x="337" y="100" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#1b1f23">Yes or no?</text><line x1="299" y1="118" x2="501" y2="118" stroke="#1b1f23" stroke-opacity="0.2"/><text x="301" y="146" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#1b1f23">Would you rather not write</text><text x="301" y="168" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#1b1f23">to new contacts from a</text><text x="301" y="190" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#1b1f23">free email address?</text><rect x="545" y="66" width="230" height="150" rx="4" fill="#fbf9f1" stroke="#1b1f23" stroke-width="1.5"/><circle cx="573" cy="94" r="14" fill="#e8a33d" stroke="#1b1f23" stroke-width="1.5"/><text x="573" y="99" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1b1f23">3</text><text x="597" y="100" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#1b1f23">Yes or no?</text><line x1="559" y1="118" x2="761" y2="118" stroke="#1b1f23" stroke-opacity="0.2"/><text x="561" y="146" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#1b1f23">Can you spare an hour or</text><text x="561" y="168" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#1b1f23">two for setup, plus a</text><text x="561" y="190" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#1b1f23">small monthly fee?</text><rect x="25" y="240" width="730" height="52" rx="4" fill="#dcebe6" stroke="#3e7c8a" stroke-width="1.5"/><text x="390" y="272" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#1b1f23">Two or more “yes”: worth setting up.   Fewer: it can wait.</text><text x="400" y="316" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#555">My judgement, not a rule.</text></svg>