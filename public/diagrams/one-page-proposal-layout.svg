<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" role="img" aria-labelledby="t d"><title id="t">Layout of a one-page proposal</title><desc id="d">A one-page proposal has five blocks: the client problem, what you will do, the timeline, the price, and one next step.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b1f23"/></marker></defs><rect x="1" y="1" width="798" height="428" fill="#f2eedd" stroke="#1b1f23" stroke-opacity="0.25"/><text x="400" y="36" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#1b1f23">One page, five blocks</text><rect x="40" y="56" width="300" height="350" rx="2" fill="#ffffff" stroke="#1b1f23" stroke-width="1.5"/><rect x="56" y="72" width="268" height="54" rx="3" fill="#e8a33d" fill-opacity="0.18" stroke="#e8a33d" stroke-width="1.5"/><text x="70" y="104" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#1b1f23">The problem</text><line x1="324" y1="99" x2="372" y2="99" stroke="#1b1f23" stroke-width="1.2" stroke-dasharray="4 3"/><text x="380" y="94" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#1b1f23">The client’s problem, in</text><text x="380" y="113" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#1b1f23">their words (2–3 sentences)</text><rect x="56" y="136" width="268" height="54" rx="3" fill="#3e7c8a" fill-opacity="0.18" stroke="#3e7c8a" stroke-width="1.5"/><text x="70" y="168" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#1b1f23">What I’ll do</text><line x1="324" y1="163" x2="372" y2="163" stroke="#1b1f23" stroke-width="1.2" stroke-dasharray="4 3"/><text x="380" y="158" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#1b1f23">3–4 deliverables,</text><text x="380" y="177" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#1b1f23">one sentence each</text><rect x="56" y="200" width="268" height="54" rx="3" fill="#8a9a5b" fill-opacity="0.18" stroke="#8a9a5b" stroke-width="1.5"/><text x="70" y="232" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#1b1f23">Timeline</text><line x1="324" y1="227" x2="372" y2="227" stroke="#1b1f23" stroke-width="1.2" stroke-dasharray="4 3"/><text x="380" y="222" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#1b1f23">Start, check-in points,</text><text x="380" y="241" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#1b1f23">and the delivery date</text><rect x="56" y="264" width="268" height="54" rx="3" fill="#c94a3f" fill-opacity="0.18" stroke="#c94a3f" stroke-width="1.5"/><text x="70" y="296" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#1b1f23">Price</text><line x1="324" y1="291" x2="372" y2="291" stroke="#1b1f23" stroke-width="1.2" stroke-dasharray="4 3"/><text x="380" y="286" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#1b1f23">One number or a range; what it</text><text x="380" y="305" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#1b1f23">includes, what is billed separately</text><rect x="56" y="328" width="268" height="54" rx="3" fill="#1b1f23" fill-opacity="0.18" stroke="#1b1f23" stroke-width="1.5"/><text x="70" y="360" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#1b1f23">Next step</text><line x1="324" y1="355" x2="372" y2="355" stroke="#1b1f23" stroke-width="1.2" stroke-dasharray="4 3"/><text x="380" y="350" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#1b1f23">One sentence, for example:</text><text x="380" y="369" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#1b1f23">reply to confirm</text></svg>