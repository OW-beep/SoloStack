<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" role="img" aria-labelledby="t d"><title id="t">Two ways a rate conversation can end</title><desc id="d">Asking for a higher rate leads either to a new rate, or, if the answer is not this year, to keeping the rate and fixing the scope, with extra work billed separately.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b1f23"/></marker></defs><rect x="1" y="1" width="798" height="328" fill="#f2eedd" stroke="#1b1f23" stroke-opacity="0.25"/><text x="400" y="36" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#1b1f23">Two ways a rate conversation can end</text><rect x="20" y="130" width="170" height="64" rx="4" fill="#fbf9f1" stroke="#1b1f23" stroke-width="1.5"/><text x="105" y="157" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#1b1f23">Ask for a</text><text x="105" y="177" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#1b1f23">higher rate</text><line x1="190" y1="162" x2="246" y2="162" stroke="#1b1f23" stroke-width="2" marker-end="url(#a)"/><polygon points="250,162 380,92 510,162 380,232" fill="#fbf9f1" stroke="#1b1f23" stroke-width="1.5"/><text x="380" y="158" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#1b1f23">What is</text><text x="380" y="177" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#1b1f23">the answer?</text><line x1="500" y1="140" x2="544" y2="92" stroke="#1b1f23" stroke-width="2" marker-end="url(#a)"/><text x="470" y="112" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#1b1f23">Yes</text><rect x="548" y="62" width="232" height="60" rx="4" fill="#dcebe6" stroke="#3e7c8a" stroke-width="1.5"/><text x="664" y="88" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1f23">The new rate</text><text x="664" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1f23">applies going forward</text><line x1="500" y1="188" x2="544" y2="236" stroke="#1b1f23" stroke-width="2" marker-end="url(#a)"/><rect x="548" y="196" width="232" height="96" rx="4" fill="#f8e6c8" stroke="#e8a33d" stroke-width="1.5"/><text x="664" y="222" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1b1f23">If “not this year”:</text><text x="664" y="242" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1b1f23">keep the rate and the scope,</text><text x="664" y="261" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1b1f23">bill extra work separately</text></svg>