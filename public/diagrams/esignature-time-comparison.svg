<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-labelledby="t d"><title id="t">The same contract, two routes</title><desc id="d">A contract sent as a PDF by email took three to four business days to be signed and returned. Sent for e-signature, it was signed the same day when the client replied promptly.</desc><rect x="1" y="1" width="798" height="298" fill="#f2eedd" stroke="#1b1f23" stroke-opacity="0.25"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b1f23"/></marker></defs><text x="400" y="36" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#1b1f23">The same contract, two routes</text><text x="30" y="84" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#1b1f23">PDF by email</text><rect x="30" y="100" width="170" height="56" rx="4" fill="#fbf9f1" stroke="#1b1f23" stroke-width="1.5"/><text x="115" y="124" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1b1f23">Send the PDF</text><line x1="202" y1="128" x2="228" y2="128" stroke="#1b1f23" stroke-width="2" marker-end="url(#a)"/><rect x="230" y="100" width="170" height="56" rx="4" fill="#fbf9f1" stroke="#1b1f23" stroke-width="1.5"/><text x="315" y="124" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1b1f23">Client prints, signs,</text><text x="315" y="141" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1b1f23">scans it</text><line x1="402" y1="128" x2="428" y2="128" stroke="#1b1f23" stroke-width="2" marker-end="url(#a)"/><rect x="430" y="100" width="170" height="56" rx="4" fill="#fbf9f1" stroke="#1b1f23" stroke-width="1.5"/><text x="515" y="124" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1b1f23">Returned by email</text><rect x="630" y="100" width="140" height="56" rx="4" fill="#f3d9d4" stroke="#1b1f23" stroke-width="1.5"/><text x="700" y="124" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1b1f23">3–4 business</text><text x="700" y="141" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1b1f23">days (my case)</text><text x="30" y="194" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#1b1f23">E-signature</text><rect x="30" y="210" width="170" height="56" rx="4" fill="#fbf9f1" stroke="#1b1f23" stroke-width="1.5"/><text x="115" y="234" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1b1f23">Send for signature</text><line x1="202" y1="238" x2="228" y2="238" stroke="#1b1f23" stroke-width="2" marker-end="url(#a)"/><rect x="230" y="210" width="170" height="56" rx="4" fill="#fbf9f1" stroke="#1b1f23" stroke-width="1.5"/><text x="315" y="234" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1b1f23">Client signs online</text><line x1="402" y1="238" x2="428" y2="238" stroke="#1b1f23" stroke-width="2" marker-end="url(#a)"/><rect x="430" y="210" width="170" height="56" rx="4" fill="#fbf9f1" stroke="#1b1f23" stroke-width="1.5"/><text x="515" y="234" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1b1f23">Signed copy is saved</text><rect x="630" y="210" width="140" height="56" rx="4" fill="#dcebe6" stroke="#1b1f23" stroke-width="1.5"/><text x="700" y="234" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1b1f23">Same day when</text><text x="700" y="251" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1b1f23">client replied</text><text x="400" y="290" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" fill="#555">From my own contracts with overseas clients. Results depend on how quickly the client responds.</text></svg>