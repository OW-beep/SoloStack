<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="t d"><title id="t">How to handle a request for extra work</title><desc id="d">A new request is compared with the agreed deliverables and revision count. If inside, do it. If outside, say so politely, offer an extra fee or separate scheduling, and confirm in writing.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b1f23"/></marker></defs><rect x="1" y="1" width="798" height="398" fill="#f2eedd" stroke="#1b1f23" stroke-opacity="0.25"/><text x="400" y="38" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#1b1f23">Every request goes through the same check</text><rect x="20" y="142" width="160" height="56" rx="4" fill="#fbf9f1" stroke="#1b1f23" stroke-width="1.5"/><text x="100" y="166" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#1b1f23">New request</text><text x="100" y="185" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#1b1f23">from the client</text><line x1="180" y1="170" x2="214" y2="170" stroke="#1b1f23" stroke-width="2" marker-end="url(#a)"/><polygon points="220,170 370,92 520,170 370,248" fill="#fbf9f1" stroke="#1b1f23" stroke-width="1.5"/><text x="370" y="160" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1f23">In the agreed</text><text x="370" y="178" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1f23">deliverables and</text><text x="370" y="196" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1f23">revision count?</text><line x1="522" y1="170" x2="566" y2="170" stroke="#1b1f23" stroke-width="2" marker-end="url(#a)"/><text x="530" y="160" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#1b1f23">Yes</text><rect x="570" y="142" width="210" height="56" rx="4" fill="#dcebe6" stroke="#3e7c8a" stroke-width="1.5"/><text x="675" y="176" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#1b1f23">Do it</text><line x1="370" y1="250" x2="370" y2="290" stroke="#1b1f23" stroke-width="2" marker-end="url(#a)"/><text x="380" y="274" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#1b1f23">No</text><rect x="190" y="292" width="360" height="64" rx="4" fill="#f8e6c8" stroke="#e8a33d" stroke-width="1.5"/><text x="370" y="318" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1f23">Say so politely and offer a choice:</text><text x="370" y="338" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1f23">an extra fee, or schedule it separately</text><line x1="552" y1="324" x2="586" y2="324" stroke="#1b1f23" stroke-width="2" marker-end="url(#a)"/><rect x="590" y="292" width="190" height="64" rx="4" fill="#fbf9f1" stroke="#1b1f23" stroke-width="1.5"/><text x="685" y="318" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1f23">Confirm in writing</text><text x="685" y="338" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1f23">and update the scope</text></svg>