<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-labelledby="t d"><title id="t">Upwork or Fiverr</title><desc id="d">if Custom, higher-value or ongoing project work: Upwork (lower effective fees); if Quick, clearly scoped services you can package: Fiverr (larger buyer volume)</desc><rect x="1" y="1" width="798" height="298" fill="#f2eedd" stroke="#1b1f23" stroke-opacity="0.25"/><text x="400" y="36" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#1b1f23">Upwork or Fiverr</text><rect x="40" y="62" width="340" height="196" rx="4" fill="#fbf9f1" stroke="#1b1f23" stroke-width="1.5"/><text x="54" y="88" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#8a5a00">IF</text><text x="210.0" y="114" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1f23">Custom, higher-value or</text><text x="210.0" y="134" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1b1f23">ongoing project work</text><line x1="54" y1="160" x2="366" y2="160" stroke="#1b1f23" stroke-opacity="0.2"/><rect x="50" y="172" width="320" height="74" rx="4" fill="#dcebe6" stroke="#3e7c8a" stroke-width="1.5"/><text x="62" y="190" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#3e7c8a">PICK</text><text x="210.0" y="214" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#1b1f23">Upwork</text><text x="210.0" y="234" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1b1f23">(lower effective fees)</text><rect x="420" y="62" width="340" height="196" rx="4" fill="#fbf9f1" stroke="#1b1f