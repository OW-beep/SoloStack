<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-labelledby="t d"><title id="t">Three questions a revision clause answers</title><desc id="d">A revision clause should say what counts as a revision, how many are included, and what happens beyond that. In my contracts a revision is an adjustment to what was agreed, two are included as a rule, and anything beyond that, or any change to the specification, is quoted as extra work.</desc><rect x="1" y="1" width="798" height="298" fill="#f2eedd" stroke="#1b1f23" stroke-opacity="0.25"/><text x="400" y="36" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#1b1f23">Three questions a revision clause answers</text><rect x="25" y="62" width="230" height="196" rx="4" fill="#fbf9f1" stroke="#1b1f23" stroke-width="1.5"/><circle cx="53" cy="92" r="14" fill="#e8a33d" stroke="#1b1f23" stroke-width="1.5"/><text x="53" y="97" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1b1f23">1</text><text x="77" y="98" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#8a5a00">ASK</text><text x="140" y="132" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#1b1f23">What counts as</text><text x="140" y="154" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#1b1f23">a revision?</text><rect x="35" y="164" width="210" height="90" rx="4" fill="#dcebe6" stroke="#3e7c8a" stroke-width="1.5"/><text x="47" y="184" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="start" fill="#3e7c8a">IN MY CONTRACTS</text><text x="140" y="203" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" text-anchor="middle" fill="#1b1f23">An adjustment to what</text><text x="140" y="221" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" text-anchor="middle" fill="#1b1f23">was originally agreed</text><rect x="285" y="62" width="230" height="196" rx="4" fill="#fbf9f1" stroke="#1b1f23" stroke-width="1.5"/><circle cx="313" cy="92" r="14" fill="#e8a33d" stroke="#1b1f23" stroke-width="1.5"/><text x="313" y="97" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1b1f23">2</text><text x="337" y="98" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#8a5a00">ASK</text><text x="400" y="132" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#1b1f23">How many are</text><text x="400" y="154" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#1b1f23">included?</text><rect x="295" y="164" width="210" height="90" rx="4" fill="#dcebe6" stroke="#3e7c8a" stroke-width="1.5"/><text x="307" y="184" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="start" fill="#3e7c8a">IN MY CONTRACTS</text><text x="400" y="203" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" text-anchor="middle" fill="#1b1f23">Two, as a rule</text><rect x="545" y="62" width="230" height="196" rx="4" fill="#fbf9f1" stroke="#1b1f23" stroke-width="1.5"/><circle cx="573" cy="92" r="14" fill="#e8a33d" stroke="#1b1f23" stroke-width="1.5"/><text x="573" y="97" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1b1f23">3</text><text x="597" y="98" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#8a5a00">ASK</text><text x="660" y="132" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#1b1f23">What happens</text><text x="660" y="154" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#1b1f23">beyond that?</text><rect x="555" y="164" width="210" height="90" rx="4" fill="#dcebe6" stroke="#3e7c8a" stroke-width="1.5"/><text x="567" y="184" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="start" fill="#3e7c8a">IN MY CONTRACTS</text><text x="660" y="203" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" text-anchor="middle" fill="#1b1f23">A new estimate; a change</text><text x="660" y="221" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" text-anchor="middle" fill="#1b1f23">to the specification is</text><text x="660" y="239" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" text-anchor="middle" fill="#1b1f23">always extra work</text><text x="400" y="286" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" fill="#555">What I write in my own contracts. An example, not legal advice.</text></svg>