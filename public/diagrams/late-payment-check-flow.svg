<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" aria-labelledby="t d"><title id="t">What to check when a payment is late</title><desc id="d">Check whether the invoice was sent, then whether it is really overdue, then send a friendly reminder, then follow up once more and read the contract’s late payment terms.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b1f23"/></marker></defs><rect x="1" y="1" width="798" height="338" fill="#f2eedd" stroke="#1b1f23" stroke-opacity="0.25"/><text x="400" y="38" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#1b1f23">Check your side first, then chase</text><rect x="20" y="80" width="160" height="150" rx="4" fill="#fbf9f1" stroke="#1b1f23" stroke-width="1.5"/><circle cx="46" cy="108" r="14" fill="#e8a33d" stroke="#1b1f23" stroke-width="1.5"/><text x="46" y="113" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1b1f23">1</text><text x="68" y="114" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#1b1f23">Sent?</text><line x1="32" y1="132" x2="168" y2="132" stroke="#1b1f23" stroke-opacity="0.2"/><text x="32" y="156" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#1b1f23">Check the sent date</text><text x="32" y="176" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#1b1f23">and who got it.</text><text x="24" y="262" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#c94a3f">Not sent? Send it now.</text><text x="24" y="280" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#c94a3f">Tie sending to delivery.</text><rect x="220" y="80" width="160" height="150" rx="4" fill="#fbf9f1" stroke="#1b1f23" stroke-width="1.5"/><circle cx="246" cy="108" r="14" fill="#e8a33d" stroke="#1b1f23" stroke-width="1.5"/><text x="246" y="113" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1b1f23">2</text><text x="268" y="114" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#1b1f23">Overdue?</text><line x1="232" y1="132" x2="368" y2="132" stroke="#1b1f23" stroke-opacity="0.2"/><text x="232" y="156" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#1b1f23">Check the payment</text><text x="232" y="176" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#1b1f23">terms and due date.</text><text x="224" y="262" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#c94a3f">Not due yet? Wait.</text><rect x="420" y="80" width="160" height="150" rx="4" fill="#fbf9f1" stroke="#1b1f23" stroke-width="1.5"/><circle cx="446" cy="108" r="14" fill="#e8a33d" stroke="#1b1f23" stroke-width="1.5"/><text x="446" y="113" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1b1f23">3</text><text x="468" y="114" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#1b1f23">Reminder</text><line x1="432" y1="132" x2="568" y2="132" stroke="#1b1f23" stroke-opacity="0.2"/><text x="432" y="156" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#1b1f23">Attach the invoice,</text><text x="432" y="176" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#1b1f23">state the amount.</text><text x="424" y="262" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#c94a3f">Assume a mistake</text><text x="424" y="280" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#c94a3f">before bad faith.</text><rect x="620" y="80" width="160" height="150" rx="4" fill="#fbf9f1" stroke="#1b1f23" stroke-width="1.5"/><circle cx="646" cy="108" r="14" fill="#e8a33d" stroke="#1b1f23" stroke-width="1.5"/><text x="646" y="113" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1b1f23">4</text><text x="668" y="114" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#1b1f23">No reply?</text><line x1="632" y1="132" x2="768" y2="132" stroke="#1b1f23" stroke-opacity="0.2"/><text x="632" y="156" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#1b1f23">Follow up once,</text><text x="632" y="176" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#1b1f23">then check the</text><text x="632" y="196" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#1b1f23">contract terms.</text><text x="624" y="262" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#c94a3f">Decide next steps</text><text x="624" y="280" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#c94a3f">only after that.</text><line x1="182" y1="155" x2="218" y2="155" stroke="#1b1f23" stroke-width="2" marker-end="url(#a)"/><line x1="382" y1="155" x2="418" y2="155" stroke="#1b1f23" stroke-width="2" marker-end="url(#a)"/><line x1="582" y1="155" x2="618" y2="155" stroke="#1b1f23" stroke-width="2" marker-end="url(#a)"/></svg>