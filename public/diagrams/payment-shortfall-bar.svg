<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" role="img" aria-labelledby="t d"><title id="t">Where a $1,000 overseas invoice went, as one estimate</title><desc id="d">Of a $1,000 invoice, about $40 went to fees and about $30 to the exchange rate gap, leaving about $930 in the bank. This is the author’s estimate for one payment.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b1f23"/></marker></defs><rect x="1" y="1" width="798" height="328" fill="#f2eedd" stroke="#1b1f23" stroke-opacity="0.25"/><text x="400" y="38" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#1b1f23">Where a $1,000 invoice went (my estimate)</text><line x1="50" y1="92" x2="750" y2="92" stroke="#1b1f23" stroke-width="1.5"/><line x1="50" y1="86" x2="50" y2="98" stroke="#1b1f23" stroke-width="1.5"/><line x1="750" y1="86" x2="750" y2="98" stroke="#1b1f23" stroke-width="1.5"/><text x="400" y="80" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#1b1f23">Invoice: $1,000</text><rect x="50" y="130" width="651" height="70" fill="#3e7c8a"/><rect x="701" y="130" width="28" height="70" fill="#e8a33d"/><rect x="729" y="130" width="21" height="70" fill="#c94a3f"/><rect x="50" y="130" width="700" height="70" fill="none" stroke="#1b1f23" stroke-width="1.5"/><text x="375" y="172" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#ffffff">≈ $930 reaches the bank</text><line x1="715" y1="130" x2="640" y2="108" stroke="#1b1f23" stroke-width="1.2"/><text x="630" y="112" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="end" fill="#1b1f23">Platform fee ≈ $40</text><line x1="740" y1="200" x2="700" y2="232" stroke="#1b1f23" stroke-width="1.2"/><text x="692" y="248" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="end" fill="#1b1f23">Exchange-rate gap ≈ $30</text><text x="50" y="288" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#555">My estimate for one payment (Nov 2023). Real amounts depend on the route and the day.</text><text x="50" y="312" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#1b1f23">Compare options by the amount that lands in your account.</text></svg>