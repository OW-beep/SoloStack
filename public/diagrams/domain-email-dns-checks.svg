<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-labelledby="t d"><title id="t">Three DNS records, three jobs</title><desc id="d">MX decides where mail is delivered, SPF lists who may send as your domain, and DKIM signs messages as yours. Check them in that order, then send a test email.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b1f23"/></marker></defs><rect x="1" y="1" width="798" height="358" fill="#f2eedd" stroke="#1b1f23" stroke-opacity="0.25"/><text x="400" y="38" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#1b1f23">Three DNS records, three jobs</text><rect x="40" y="70" width="200" height="185" rx="4" fill="#fbf9f1" stroke="#1b1f23" stroke-width="1.5"/><circle cx="70" cy="98" r="14" fill="#e8a33d" stroke="#1b1f23" stroke-width="1.5"/><text x="70" y="103" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1b1f23">1</text><text x="94" y="106" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#1b1f23">MX</text><text x="56" y="150" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="start" fill="#1b1f23">Delivers incoming mail</text><line x1="56" y1="168" x2="224" y2="168" stroke="#1b1f23" stroke-opacity="0.2"/><text x="56" y="196" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#c94a3f">If wrong: mail to your</text><text x="56" y="215" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#c94a3f">address never arrives</text><rect x="300" y="70" width="200" height="185" rx="4" fill="#fbf9f1" stroke="#1b1f23" stroke-width="1.5"/><circle cx="330" cy="98" r="14" fill="#e8a33d" stroke="#1b1f23" stroke-width="1.5"/><text x="330" y="103" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1b1f23">2</text><text x="354" y="106" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#1b1f23">SPF</text><text x="316" y="150" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="start" fill="#1b1f23">Lists who may send</text><line x1="316" y1="168" x2="484" y2="168" stroke="#1b1f23" stroke-opacity="0.2"/><text x="316" y="196" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#c94a3f">If wrong: more of your</text><text x="316" y="215" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#c94a3f">mail goes to spam</text><rect x="560" y="70" width="200" height="185" rx="4" fill="#fbf9f1" stroke="#1b1f23" stroke-width="1.5"/><circle cx="590" cy="98" r="14" fill="#e8a33d" stroke="#1b1f23" stroke-width="1.5"/><text x="590" y="103" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1b1f23">3</text><text x="614" y="106" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#1b1f23">DKIM</text><text x="576" y="150" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="start" fill="#1b1f23">Signs your messages</text><line x1="576" y1="168" x2="744" y2="168" stroke="#1b1f23" stroke-opacity="0.2"/><text x="576" y="196" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#c94a3f">If wrong: messages are</text><text x="576" y="215" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#c94a3f">sent unsigned</text><line x1="242" y1="162" x2="298" y2="162" stroke="#1b1f23" stroke-width="2" marker-end="url(#a)"/><line x1="502" y1="162" x2="558" y2="162" stroke="#1b1f23" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="285" width="720" height="48" rx="4" fill="#e9e4d0" stroke="#1b1f23" stroke-width="1.5"/><text x="400" y="314" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#1b1f23">Then test: email an outside address, open “Show original”, look for pass</text></svg>